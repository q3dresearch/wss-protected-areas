<text x="318.0" y="379.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#eb6834" text-anchor="start" font-weight="600">-47%</text>
<text x="526.0" y="379.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11.5" fill="#2a78d6" text-anchor="end" font-weight="normal">759.5 to 738.3</text>
<text x="538.0" y="379.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#52514e" text-anchor="start" font-weight="600">-3%</text>
<text x="56.0" y="405.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="normal">Borjomi Strict Reserve</text>
<text x="306.0" y="405.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11.5" fill="#eb6834" text-anchor="end" font-weight="normal">1,093.0 to 647.6</text>
<text x="318.0" y="405.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#eb6834" text-anchor="start" font-weight="600">-41%</text>
<text x="526.0" y="405.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11.5" fill="#2a78d6" text-anchor="end" font-weight="normal">648.2 to 647.8</text>
<text x="538.0" y="405.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#2a78d6" text-anchor="start" font-weight="600">-0%</text>
<text x="56.0" y="431.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="normal">Kolkheti National Park</text>
<text x="306.0" y="431.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11.5" fill="#eb6834" text-anchor="end" font-weight="normal">808.0 to 450.1</text>
<text x="318.0" y="431.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#eb6834" text-anchor="start" font-weight="600">-44%</text>
<text x="526.0" y="431.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11.5" fill="#2a78d6" text-anchor="end" font-weight="normal">443.2 to 449.6</text>
<text x="538.0" y="431.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#2a78d6" text-anchor="start" font-weight="600">+1%</text>
<text x="56.0" y="457.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="normal">Vashlovani National Park</text>
<text x="306.0" y="457.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11.5" fill="#eb6834" text-anchor="end" font-weight="normal">442.5 to 250.2</text>
<text x="318.0" y="457.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#eb6834" text-anchor="start" font-weight="600">-43%</text>
<text x="526.0" y="457.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11.5" fill="#2a78d6" text-anchor="end" font-weight="normal">250.5 to 250.3</text>
<text x="538.0" y="457.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#2a78d6" text-anchor="start" font-weight="600">-0%</text>
<text x="56.0" y="483.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="normal">Tbilisi National Park</text>
<text x="306.0" y="483.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11.5" fill="#eb6834" text-anchor="end" font-weight="normal">380.0 to 210.3</text>
<text x="318.0" y="483.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#eb6834" text-anchor="start" font-weight="600">-45%</text>
<text x="526.0" y="483.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11.5" fill="#2a78d6" text-anchor="end" font-weight="normal">210.7 to 210.6</text>
