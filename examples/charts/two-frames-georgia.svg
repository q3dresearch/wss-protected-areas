<line x1="56.0" y1="512.0" x2="884.0" y2="512.0" stroke="#e1e0d9" stroke-width="1"/>
<text x="56.0" y="538.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="15" fill="#0b0b0b" text-anchor="start" font-weight="600">The boundaries did not move. The numbers did.</text>
<text x="56.0" y="562.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12" fill="#52514e" text-anchor="start" font-weight="normal">Kazbegi's reported area fell 46% while its measured area moved 0.1%. Six of the largest drops are the same story: a reported figure that was</text>
<text x="56.0" y="580.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12" fill="#52514e" text-anchor="start" font-weight="normal">roughly double the polygon, corrected to match it. Read from one frame, Georgia looks like a country that lost half its biggest parks.</text>
<text x="56.0" y="604.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="600">This is P7, and it is answerable only across frames.</text>
</svg>
