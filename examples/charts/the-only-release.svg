<text x="56.0" y="48.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="20" fill="#0b0b0b" text-anchor="start" font-weight="600">Nine months of the World Database on Protected Areas, asked for</text>
<text x="56.0" y="74.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="13" fill="#52514e" text-anchor="start" font-weight="normal">Every release lives at the same /current/ path. Only one of them is still there.</text>
<text x="56.0" y="96.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12" fill="#898781" text-anchor="start" font-weight="normal">Each bar is one HTTP request made on 2026-09-11 to d1gam3xoknrgr2.cloudfront.net/current/WDPA_&lt;month&gt;_Public_csv.zip,</text>
<text x="56.0" y="112.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12" fill="#898781" text-anchor="start" font-weight="normal">and to the same filename under its own month prefix. Earlier releases are available on request — by email, from UNEP-WCMC.</text>
<text x="196.0" y="171.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12" fill="#0b0b0b" text-anchor="end" font-weight="600">Sep 2026</text>
