<text x="56.0" y="432.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12" fill="#52514e" text-anchor="start" font-weight="normal">The surviving release holds 312,943 sites and 75,626,603 km². Nothing in it records what left.</text>
