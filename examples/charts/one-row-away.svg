<text x="56.0" y="96.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12" fill="#898781" text-anchor="start" font-weight="normal">Site COUNT hides this completely: Denmark lists 1,173 protected areas and 91% of its area is one of them.</text>
<text x="56.0" y="112.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12" fill="#898781" text-anchor="start" font-weight="normal">The named site on each bar is the one whose disappearance would take that share of the country's protected estate with it.</text>
