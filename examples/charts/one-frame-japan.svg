<text x="56.0" y="596.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="600">This chart cannot tell you what Japan protected in 1975.</text>
<text x="56.0" y="618.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12" fill="#52514e" text-anchor="start" font-weight="normal">It tells you what Japan protected in 1975 that is still on the register fifty-one years later. The difference is every site that left,</text>
<text x="56.0" y="636.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12" fill="#52514e" text-anchor="start" font-weight="normal">and nothing in a single release distinguishes the two. That is what the next chart is for.</text>
</svg>
